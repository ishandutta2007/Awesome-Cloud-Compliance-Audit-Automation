<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* CSS Animations for Dynamic Dynamic Visual Elements (in background/sides) */
    @keyframes float1 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes pulse-ring {
      0% { r: 14px; opacity: 0.8; }
      50% { r: 22px; opacity: 0.2; }
      100% { r: 14px; opacity: 0.8; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    @keyframes scanline {
      0% { transform: translateY(-100px); }
      100% { transform: translateY(500px); }
    }
    
    .animated-bg-card1 { animation: float1 6s ease-in-out infinite; }
    .animated-bg-card2 { animation: float2 8s ease-in-out infinite; }
    .pulse-elem { animation: pulse-ring 3s infinite ease-in-out; }
    .dash-line { stroke-dasharray: 8, 8; animation: dash 4s linear infinite; }
    
    .title-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; fill: #ffffff; }
    .subtitle-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; fill: #94a3b8; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    .card-label { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 12px; fill: #cbd5e1; }
    .card-val { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: #10b981; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>
  
  <!-- Subtle Grid Pattern Background -->
  <g opacity="0.08">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200 M0 350 H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400 M600 0 V400 M700 0 V400 M800 0 V400 M900 0 V400 M1000 0 V400 M1100 0 V400" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Dynamic Animated Background Elements (Left & Right Side Decor, placed behind text) -->
  
  <!-- Left Side Visual Widget (Security/Compliance Node) -->
  <g class="animated-bg-card1" transform="translate(60, 80)" filter="url(#shadow)">
    <rect width="220" height="110" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="14" fill="#0369a1"/>
    <path d="M30 35 L33 38 L40 31" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="60" y="32" class="card-label">SOC 2 TYPE II</text>
    <text x="60" y="48" font-size="11" fill="#64748b" font-family="sans-serif">Automated Audit</text>
    <rect x="20" y="70" width="180" height="8" rx="4" fill="#1e293b"/>
    <rect x="20" y="70" width="155" height="8" rx="4" fill="url(#accent-cyan)"/>
    <text x="20" y="98" class="card-val">100% Compliant</text>
    <text x="145" y="98" font-size="11" fill="#94a3b8" font-family="sans-serif">50/50 Controls</text>
  </g>

  <!-- Left Side Bottom Widget (Continuous Monitoring) -->
  <g class="animated-bg-card2" transform="translate(90, 230)" filter="url(#shadow)">
    <rect width="200" height="90" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="10" fill="#15803d"/>
    <circle cx="30" cy="30" class="pulse-elem" fill="none" stroke="#22c55e" stroke-width="2"/>
    <text x="50" y="34" class="card-label">Continuous Evidence</text>
    <path d="M20 65 Q 40 45, 60 60 T 100 50 T 140 65 T 180 40" stroke="#38bdf8" stroke-width="2.5" fill="none" class="dash-line"/>
  </g>

  <!-- Right Side Visual Widget (Multi-Framework Shield) -->
  <g class="animated-bg-card2" transform="translate(910, 70)" filter="url(#shadow)">
    <rect width="230" height="130" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="30" class="card-label">FRAMEWORK COVERAGE</text>
    
    <rect x="20" y="45" width="85" height="26" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
    <text x="30" y="62" font-size="11" font-weight="bold" fill="#c7d2fe" font-family="sans-serif">ISO 27001</text>
    
    <rect x="115" y="45" width="95" height="26" rx="6" fill="#831843" stroke="#f43f5e" stroke-width="1"/>
    <text x="125" y="62" font-size="11" font-weight="bold" fill="#fecdd3" font-family="sans-serif">PCI-DSS v4.0</text>

    <rect x="20" y="80" width="75" height="26" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="30" y="97" font-size="11" font-weight="bold" fill="#a7f3d0" font-family="sans-serif">HIPAA</text>

    <rect x="105" y="80" width="105" height="26" rx="6" fill="#701a75" stroke="#d946ef" stroke-width="1"/>
    <text x="115" y="97" font-size="11" font-weight="bold" fill="#f5d0fe" font-family="sans-serif">NIST CSF 2.0</text>
  </g>

  <!-- Right Side Bottom Widget (Auto-Fix Status) -->
  <g class="animated-bg-card1" transform="translate(880, 230)" filter="url(#shadow)">
    <rect width="220" height="95" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="30" class="card-label">AUTO-REMEDIATION</text>
    <path d="M20 50 L180 50" stroke="#334155" stroke-width="1"/>
    <circle cx="32" cy="70" r="12" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1.5"/>
    <text x="28" y="75" font-size="12" fill="#e9d5ff" font-weight="bold" font-family="sans-serif">⚡</text>
    <text x="52" y="68" font-size="12" font-weight="bold" fill="#ffffff" font-family="sans-serif">Policy-as-Code</text>
    <text x="52" y="82" font-size="11" fill="#94a3b8" font-family="sans-serif">OPA &amp; Rego Engine</text>
  </g>

  <!-- CENTER FOREGROUND CONTENT (Guaranteed Unobscured Title & Subtitle) -->
  <g transform="translate(600, 160)" text-anchor="middle">
    
    <!-- Top Pill Badge -->
    <g transform="translate(0, -65)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)"/>
      <text y="5" text-anchor="middle" class="badge-text">🛡️ CLOUD COMPLIANCE &amp; GRC</text>
    </g>

    <!-- Main Title -->
    <text y="15" class="title-text" font-size="36" letter-spacing="-0.5">Awesome Cloud Compliance</text>
    <text y="55" class="title-text" font-size="36" fill="url(#accent-cyan)" letter-spacing="-0.5">&amp; Audit Automation</text>

    <!-- Subtitle -->
    <text y="105" class="subtitle-text" font-size="16">
      Curated Commercial SaaS Platforms &amp; Self-Hosted Open-Source Frameworks
    </text>
    <text y="130" font-family="sans-serif" font-size="13" fill="#64748b">
      SOC 2 • ISO 27001 • HIPAA • PCI DSS • NIST • Continuous Evidence Collection
    </text>
  </g>

</svg>
